name: Build APK for Pixel 10 Pro

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x lint -x detekt -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AICoreChat-Pixel10Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
